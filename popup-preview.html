<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Popup Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Heebo', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .mock-website {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            background: linear-gradient(135deg, #1a1f2e 0%, #16213e 100%);
            overflow: hidden;
        }

        .mock-website::before {
            content: "תוכן אתר - Website Content Mixed Text";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: rgba(148, 163, 184, 0.3);
            text-align: center;
            width: 90%;
            line-height: 1.8;
            z-index: 1;
        }

        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.95), rgba(5, 10, 20, 0.95));
            border: 1px solid rgba(20, 184, 166, 0.2);
            border-radius: 24px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(20, 184, 166, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 11;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close-btn {
            position: absolute;
            left: 16px;
            top: 16px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .close-btn:hover {
            color: #14b8a6;
            background: rgba(255, 255, 255, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            margin-top: 8px;
        }

        .emoji {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(to right, #5eead4, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input[type="email"] {
            width: 100%;
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 0 16px;
            color: #f1f5f9;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }

        input[type="email"]::placeholder {
            color: #94a3b8;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: rgba(20, 184, 166, 0.5);
            box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.1);
            background: rgba(255, 255, 255, 0.08);
        }

        .submit-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(to right, #14b8a6, #06b6d4);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .submit-btn:hover {
            box-shadow: 0 0 30px rgba(20, 184, 166, 0.3);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Success State */
        .success-content {
            text-align: center;
            padding: 16px 0;
        }

        .checkmark {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            color: #10b981;
        }

        .success-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(to right, #6ee7b7, #14b8a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .success-text {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .link-box {
            background: linear-gradient(to right, #14b8a6, #06b6d4);
            color: #0f172a;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            word-break: break-all;
            margin-bottom: 12px;
            transition: all 0.2s;
            cursor: pointer;
            font-family: monospace;
        }

        .link-box:hover {
            box-shadow: 0 0 30px rgba(20, 184, 166, 0.4);
        }

        .toggle-btn {
            padding: 8px 16px;
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            font-family: inherit;
            margin-top: 12px;
        }

        .toggle-btn:hover {
            background: rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
        }

        .content-hidden {
            display: none;
        }

        .content-visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="mock-website"></div>

    <div class="backdrop">
        <div class="modal">
            <button class="close-btn">✕</button>

            <!-- Form State (Default) -->
            <div id="formState" class="content-visible">
                <div class="header">
                    <span class="emoji">🎁</span>
                    <h2 class="title">קיבלת מתנה ממני</h2>
                    <p class="subtitle">
                        מדריך מעשי: איך לבנות מודל תזרים מזומנים ל-13 שבועות עם Claude — צעד אחר צעד
                    </p>
                </div>

                <form class="form-group">
                    <input
                        type="email"
                        placeholder="הכנס את האימייל שלך"
                        required
                    >
                    <button type="button" class="submit-btn" onclick="showSuccess()">
                        פתח את המדריך
                    </button>
                </form>
            </div>

            <!-- Success State -->
            <div id="successState" class="content-hidden">
                <div class="success-content">
                    <div class="checkmark">✓</div>
                    <h3 class="success-title">נרשמת בהצלחה!</h3>
                    <p class="success-text">
                        הנה הלינק למצגת:
                    </p>
                    <div class="link-box" onclick="openLink()">
                        https://gamma.app/docs/13--arjgfdjt26gnn74?mode=doc
                    </div>
                    <p style="font-size: 11px; color: #64748b; margin-top: 12px;">
                        (לחץ כדי לפתוח או העתק את הלינק)
                    </p>
                </div>
            </div>

            <button class="toggle-btn" onclick="toggleState()" style="width: 100%; margin-top: 24px;">
                הצג את המצב השני →
            </button>
        </div>
    </div>

    <script>
        function showSuccess() {
            document.getElementById('formState').classList.add('content-hidden');
            document.getElementById('successState').classList.remove('content-hidden');
        }

        function toggleState() {
            const formState = document.getElementById('formState');
            const successState = document.getElementById('successState');

            formState.classList.toggle('content-hidden');
            successState.classList.toggle('content-hidden');
        }

        function openLink() {
            window.open('https://gamma.app/docs/13--arjgfdjt26gnn74?mode=doc', '_blank');
        }
    </script>
</body>
</html>
