  - main [ref=e22]:
    - article [ref=e24]:
      - generic [ref=e25]:
        - heading "איך מחלקת הכספים של Anthropic חסכה 20 שעות שבועיות עם Claude" [level=1] [ref=e26]
        - generic [ref=e27]:
          - generic [ref=e28]: מאת רונן עמוס, רו"ח
          - time [ref=e29]: 2 ביוני 2026
        - paragraph [ref=e30]: Alice Fong, אנליסטית פיננסית ב-Anthropic, חושפת איך Claude שומר על עקביות הנרטיב בדוחות הדירקטוריון, מייצר טיוטות ראשוניות לסקירות חודשיות, ומאבחן מודלים פיננסיים — וחוסך לה 10–20 שעות בשבוע.
      - generic [ref=e31]:
        - paragraph [ref=e32]:
          - img "מחלקת כספים עובדת עם Claude AI" [ref=e33]
        - paragraph [ref=e34]: "בעבודה פיננסית, המשימה האמיתית שלכם היא לספר את הסיפור מאחורי המספרים: להסביר למה מדד מפתח השתנה, לקשר בין תוצאות לאסטרטגיה, ולהכין נרטיב שהדירקטוריון מבין. אבל בפועל? רוב הזמן עובר על לוודא שהמספרים נכונים — לקרוא את הפרזנטציה בפעם הרביעית אחרי שהנתונים התרעננו שוב."
        - paragraph [ref=e35]: Alice Fong, מצוות הפיננסים והאסטרטגיה של Anthropic, תיארה לאחרונה איך שינתה את שגרת העבודה שלה עם Claude. הממצאים רלוונטיים לכל CFO, בקר וסמנכ"ל כספים שמוצא את עצמו שקוע בבדיקות עקביות במקום בניתוח אמיתי.
        - separator [ref=e36]
        - 'heading "הבעיה שכולם מכירים: הנרטיב שמתפרק עם כל רענון" [level=2] [ref=e37]'
        - paragraph [ref=e38]: "דמיינו מצגת לדירקטוריון שעובדת בשיתוף של כמה אנשים. כל אחד מעדכן את השקפים שלו, המספרים מתרעננים עד הבוקר שהיא יוצאת — ועכשיו צריך לוודא: האם הפירוש בשקף 4 עדיין מתיישב עם הנתון בשקף 17? האם מישהו הכניס מדד בלי להגדיר אותו? האם הסיפור עדיין עקבי מהתחלה ועד הסוף?"
        - paragraph [ref=e39]: "Alice מנהלת בדיוק את זה ברבעון: ה-deck של ה-CFO לדירקטוריון. לפני Claude, היא הייתה צריכה לקרוא את כל המצגת מחדש עם כל רענון נתונים. עכשיו:"
        - blockquote [ref=e40]:
          - paragraph [ref=e41]: "\"Claude עושה את כל זה בשבילי. הוא שומר על שכבת העקביות מתחת לעבודה, כדי שהזמן שלי ילך לנרטיב שמעל.\""
        - separator [ref=e42]
        - heading "3 תהליכי עבודה שבהם Claude שינה את כל הכללים" [level=2] [ref=e43]
        - heading "1. מצגת הדירקטוריון — רבעוני" [level=3] [ref=e44]
        - paragraph [ref=e45]: "Alice מעלה את הקובץ ל-Claude Cowork ומבקשת ממנו לוודא שכל מספר וטענה מתיישבים עם מקור נתונים יחיד. היא גם מבקשת ממנו לקרוא את הנרטיב כמו שחבר דירקטוריון יקרא אותו: לסמן סתירות, להצביע על הנחות שהקורא לא מכיר."
        - paragraph [ref=e46]:
          - text: Claude תופס דברים שהיא הייתה מפספסת — וחשוב מכך, הוא עושה את זה
          - strong [ref=e47]: בכל פעם שהמספרים זזים
          - text: ", לא רק פעם אחת."
        - heading "2. סקירה חודשית — ניתוח סטיות" [level=3] [ref=e48]
        - paragraph [ref=e49]: "מסמך Google עם טאב לכל חודש — ניתוח סטיות מול תחזית. כשמגיע הזמן לכתוב את החודש, היא מעתיקה לתוך המסמך את הטבלה הפיננסית הרלוונטית, מקשרת הקשר תומך, ומבקשת מ-Claude Cowork לכתוב טיוטה ראשונה בסגנון הקבוע:"
        - paragraph [ref=e50]:
          - emphasis [ref=e51]: "\"ההכנסות עמדו על A לעומת B, סטייה של C%, מונעת על ידי D.\""
        - paragraph [ref=e52]:
          - text: היא עורכת מכאן.
          - strong [ref=e53]: עקביות בסגנון
          - text: — חודש אחרי חודש — חשובה לא פחות מדיוק המספרים.
        - heading "3. אבחון מודלים פיננסיים — לפי צורך" [level=3] [ref=e54]
        - paragraph [ref=e55]: כשפותחים מודל שמישהו אחר בנה, Claude for Excel יכול לאבחן אותו לפני שמשקיעים שעות בהבנתו. הוא עוקב אחרי הפניות בין טאבים, מוצא את שורש הבעיה כשמאזן לא מסתדר, ומסכם את מנועי המפתח של המודל.
        - separator [ref=e56]
        - 'heading "מה גורם לזה לעבוד: זיכרון ההקשר" [level=2] [ref=e57]'
        - paragraph [ref=e58]:
          - text: הכלי שמאפשר את כל זה הוא
          - strong [ref=e59]: project memory
          - text: — Claude שומר הקשר לאורך זמן. Alice מוסיפה מסמכים חשובים לזיכרון הפרויקט, ומייד שהתקבלה החלטה בשרשור ארוך היא מבקשת מ-Claude לחלץ את המסקנה ואת ההנמקה.
        - paragraph [ref=e60]:
          - text: היא גם מחזיקה
          - strong [ref=e61]: פרויקטים נפרדים
          - text: לקהלים שונים — אחד לסקירה החודשית, אחד ל-deck של הדירקטוריון. הטון והמוסכמות שונים, ולכן גם הזיכרון שונה.
        - separator [ref=e62]
        - heading "מה עושה שאר מחלקת הכספים של Anthropic?" [level=2] [ref=e63]
